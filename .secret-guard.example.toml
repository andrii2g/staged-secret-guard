version = 1

[scan]
fail_on = "high"
max_file_size_bytes = 1048576
respect_gitignore = true
fail_on_read_error = true

[exclude]
paths = [
  ".git/**",
  "target/**",
  "node_modules/**",
  "bin/**",
  "obj/**",
  ".idea/**",
  ".vs/**",
  "dist/**",
  "build/**",
  "coverage/**",
  "**/*.min.js",
  "**/*.map"
]

[[allowlist]]
rule = "generic-secret-assignment"
path = "tests/fixtures/**"
reason = "Synthetic fixture content assembled from safe fragments"
