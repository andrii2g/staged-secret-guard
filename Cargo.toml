[package]
name = "staged-secret-guard"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A deterministic pre-commit scanner for likely secrets in staged Git content"
license = "MIT"
readme = "README.md"
keywords = ["git", "security", "secrets", "pre-commit", "cli"]
categories = ["command-line-utilities", "development-tools"]
publish = false

[lib]
name = "secret_guard"
path = "src/lib.rs"

[[bin]]
name = "secret-guard"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
globset = "0.4"
ignore = "0.4"
regex = "1.12.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.9"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
